<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Helios mark — "the sun is the prompt".
    A radiant sun disk carved with a terminal chevron ❯ and block cursor,
    orbited by the governed-gateway ring. Reads at 16px, works in one color.
  -->
  <defs>
    <linearGradient id="sunCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.55" stop-color="#F4A261"/>
      <stop offset="1" stop-color="#E76F51"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#7209B7"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded background plate -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- governed orbit ring + gateway nodes -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.75"/>
  <g fill="#4CC9F0">
    <circle cx="396" cy="396" r="10"/>
    <circle cx="58"  cy="256" r="8"/>
    <circle cx="336" cy="73"  r="8"/>
  </g>

  <!-- sun rays (12, tapered) -->
  <g fill="#FFD166" opacity="0.85">
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(0 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(30 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(60 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(90 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(120 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(150 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(180 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(210 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(240 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(270 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(300 256 256)"/>
    <rect x="250" y="86" width="12" height="38" rx="6" transform="rotate(330 256 256)"/>
  </g>

  <!-- sun disk -->
  <circle cx="256" cy="256" r="118" fill="url(#sunCore)" filter="url(#glow)"/>

  <!-- terminal prompt: chevron + block cursor, carved from the sun -->
  <path d="M 203 206 L 258 256 L 203 306"
        fill="none" stroke="#0B1220" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="282" y="286" width="48" height="28" rx="8" fill="#0B1220"/>
</svg>
