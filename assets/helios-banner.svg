<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Helios banner — emerald lantern-ring on black. -->
  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A0F"/>
      <stop offset="0.55" stop-color="#06110A"/>
      <stop offset="1" stop-color="#030704"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CFFC0"/>
      <stop offset="0.45" stop-color="#00E676"/>
      <stop offset="1" stop-color="#0B8A43"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B8A43"/>
      <stop offset="0.5" stop-color="#00E676"/>
      <stop offset="1" stop-color="#0B8A43"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgTop)"/>

  <!-- polished top edge line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#edge)"/>

  <!-- subtle grid -->
  <g fill="none" stroke="#00E676" opacity="0.06">
    <line x1="0" y1="160" x2="1280" y2="160" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke-width="1"/>
  </g>

  <!-- left: halo + lantern-ring mark -->
  <circle cx="360" cy="320" r="340" fill="url(#halo)"/>
  <g transform="translate(360 320)">
    <!-- lantern bars -->
    <g fill="url(#edge)" filter="url(#softGlow)">
      <rect x="-52" y="-172" width="104" height="15" rx="7.5"/>
      <rect x="-52" y="157" width="104" height="15" rx="7.5"/>
    </g>
    <!-- the ring -->
    <circle r="122" fill="none" stroke="#032612" stroke-width="34" opacity="0.9"/>
    <circle r="122" fill="none" stroke="url(#ringGrad)" stroke-width="20" filter="url(#glow)"/>
    <path d="M -86 -86 A 122 122 0 0 1 0 -122" fill="none" stroke="#CFFFE3"
          stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <!-- terminal prompt core -->
    <g filter="url(#softGlow)">
      <path d="M -38 -38 L 3 0 L -38 38" fill="none" stroke="#2EE86B"
            stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="22" y="24" width="36" height="21" rx="6" fill="#2EE86B"/>
    </g>
  </g>

  <!-- right: text -->
  <text x="660" y="266" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="30" letter-spacing="9" fill="#34D399">HELIOS</text>
  <text x="660" y="326" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="56" letter-spacing="1" fill="#FFFFFF">Governed AI</text>
  <text x="660" y="388" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="56" letter-spacing="1" fill="#00E676">Command Center</text>

  <g transform="translate(660 462)">
    <circle cx="6" cy="0" r="6" fill="#00E676"/>
    <text x="24" y="7" font-family="Helvetica, Arial, sans-serif" font-size="20"
          fill="#9BB8A6">One governed AI runtime. Multiple enterprise workflows.</text>
  </g>
  <g transform="translate(660 508)">
    <circle cx="6" cy="0" r="6" fill="#34D399"/>
    <text x="24" y="7" font-family="Helvetica, Arial, sans-serif" font-size="20"
          fill="#9BB8A6">The domain changes. The governance does not.</text>
  </g>

  <!-- chip row -->
  <g transform="translate(660 610)" font-family="'Segoe UI', Arial, sans-serif" font-size="16">
    <g>
      <rect x="0" y="-16" width="132" height="32" rx="16" fill="none"
            stroke="#00E676" stroke-opacity="0.55"/>
      <text x="66" y="4" text-anchor="middle" fill="#00E676">AI Gateway</text>
    </g>
    <g>
      <rect x="144" y="-16" width="176" height="32" rx="16" fill="none"
            stroke="#34D399" stroke-opacity="0.55"/>
      <text x="232" y="4" text-anchor="middle" fill="#34D399">Governed Workflows</text>
    </g>
    <g>
      <rect x="332" y="-16" width="120" height="32" rx="16" fill="none"
            stroke="#8CFFC0" stroke-opacity="0.5"/>
      <text x="392" y="4" text-anchor="middle" fill="#8CFFC0">Guardrails</text>
    </g>
    <g>
      <rect x="464" y="-16" width="150" height="32" rx="16" fill="none"
            stroke="#00E676" stroke-opacity="0.55"/>
      <text x="539" y="4" text-anchor="middle" fill="#00E676">Terminal Agent</text>
    </g>
  </g>
</svg>
