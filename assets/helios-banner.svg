<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203C"/>
      <stop offset="0.55" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="sunCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.55" stop-color="#F4A261"/>
      <stop offset="1" stop-color="#E76F51"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#7209B7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgTop)"/>

  <!-- polished top edge line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#ring)"/>

  <!-- subtle radar grid -->
  <g fill="none" stroke="#4CC9F0" opacity="0.10">
    <line x1="0"   y1="160" x2="1280" y2="160" stroke-width="1"/>
    <line x1="0"   y1="320" x2="1280" y2="320" stroke-width="1"/>
    <line x1="0"   y1="480" x2="1280" y2="480" stroke-width="1"/>
  </g>

  <!-- left HALO + LOGO -->
  <circle cx="360" cy="320" r="360" fill="url(#halo)"/>
  <g transform="translate(360 320)">
    <!-- command rings -->
    <g fill="none" stroke="#4CC9F0" opacity="0.3">
      <circle r="212" stroke-width="2" stroke-dasharray="4 12"/>
      <circle r="160" stroke-width="1.5" stroke-dasharray="2 8"/>
      <line x1="-212" y1="0" x2="212" y2="0" stroke-width="1"/>
      <line x1="0" y1="-212" x2="0" y2="212" stroke-width="1"/>
    </g>
    <circle r="212" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.9"/>
    <!-- orbital nodes -->
    <g fill="#4CC9F0">
      <circle cx="212" cy="96" r="10"/>
      <circle cx="96" cy="212" r="8"/>
      <circle cx="-150" cy="-150" r="8"/>
      <circle cx="-78" cy="-198" r="7"/>
    </g>
    <!-- sun rays -->
    <g fill="#FFD166" opacity="0.6">
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(0)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(30)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(60)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(90)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(120)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(150)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(180)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(210)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(240)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(270)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(300)"/>
      <rect x="-6" y="-140" width="12" height="30" rx="6" transform="rotate(330)"/>
    </g>
    <!-- core: the sun is the prompt -->
    <circle r="92" fill="url(#sunCore)" filter="url(#glow)"/>
    <path d="M -41 -39 L 2 0 L -41 39"
          fill="none" stroke="#0B1220" stroke-width="24"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21" y="23" width="38" height="22" rx="6" fill="#0B1220"/>
  </g>

  <!-- right text content -->
  <text x="660" y="270" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="9" fill="#4CC9F0">HELIOS</text>
  <text x="660" y="330" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="1" fill="#FFFFFF">Enterprise AI</text>
  <text x="660" y="392" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="1" fill="#FFD166">Command Center</text>

  <g transform="translate(660 470)">
    <circle cx="6" cy="0" r="7" fill="#4CC9F0"/>
    <text x="26" y="8" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#B9C6DE">A governed, observable OS above models,</text>
  </g>
  <g transform="translate(660 520)">
    <circle cx="6" cy="0" r="7" fill="#FFD166"/>
    <text x="26" y="8" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="26" fill="#B9C6DE">data, and applications.</text>
  </g>

  <!-- chip row -->
  <g transform="translate(660 620)">
    <g>
      <rect x="0"   y="-16" width="140" height="32" rx="16" fill="none" stroke="#4CC9F0" stroke-opacity="0.5"/>
      <text x="70" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4CC9F0">AI Gateway</text>
    </g>
    <g>
      <rect x="152" y="-16" width="140" height="32" rx="16" fill="none" stroke="#FFD166" stroke-opacity="0.5"/>
      <text x="222" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFD166">Grounded RAG</text>
    </g>
    <g>
      <rect x="304" y="-16" width="140" height="32" rx="16" fill="none" stroke="#7209B7" stroke-opacity="0.8"/>
      <text x="374" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#B794F6">Guardrails</text>
    </g>
    <g>
      <rect x="456" y="-16" width="150" height="32" rx="16" fill="none" stroke="#4CC9F0" stroke-opacity="0.5"/>
      <text x="531" y="4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4CC9F0">Terminal Agent</text>
    </g>
  </g>
</svg>