services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      POSTGRES_DB: helios
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HELIOS_DATABASE_URL: postgresql+psycopg2://helios:helios@db:5432/helios
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
